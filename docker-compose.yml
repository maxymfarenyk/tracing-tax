# gateway -> orders -> inventory (Redis) / payments, traced via OTel zero-code
# instrumentation, exported to an OTel Collector, stored and visualised in
# Jaeger v2. Prometheus + cAdvisor + Grafana collect resource metrics.

# Fixed project name: metric labels (com.docker.compose.project) must not
# depend on the directory the repo is cloned into.
name: tracing-tax

# Resource limits must be identical across all experiment scenarios.
x-service-limits: &service-limits
  cpus: 1.0
  mem_limit: 512m

# Monitoring has its own limits: it must not compete for the measured services'
# budget, and its overhead is the same in every scenario.
x-monitoring-limits: &monitoring-limits
  cpus: 0.5
  mem_limit: 256m

x-otel-env: &otel-env
  # Only traces are in scope; metrics/logs export would add unrelated overhead.
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  # Sampling is configured only here, via standard SDK env vars.
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
  # Keep health-check probes out of the traces.
  OTEL_PYTHON_EXCLUDED_URLS: health

# Healthchecks run inside the measured containers, so their CPU counts against
# the services. Starting a Python interpreter per probe cost ~350 ms CPU (~7% of
# a core at a 5 s interval); this bash /dev/tcp probe costs ~4 ms. Probes run
# every second during startup (fast `up --wait`), then only every 30 s.
x-py-healthcheck: &py-healthcheck
  test:
    - CMD
    - bash
    - -c
    - 'exec 3<>/dev/tcp/127.0.0.1/8000 && printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "'
  interval: 30s
  timeout: 3s
  retries: 3
  start_period: 30s
  start_interval: 1s

services:
  gateway:
    build:
      context: ./services
      args:
        SERVICE: gateway
    image: tracing-tax/gateway:dev
    <<: *service-limits
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: gateway
      ORDERS_URL: http://orders:8000
      ERROR_RATE: ${GATEWAY_ERROR_RATE:-0}
      SLOW_RATE: ${GATEWAY_SLOW_RATE:-0}
    ports:
      - "8080:8000"
    depends_on:
      orders:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck: *py-healthcheck

  orders:
    build:
      context: ./services
      args:
        SERVICE: orders
    image: tracing-tax/orders:dev
    <<: *service-limits
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: orders
      INVENTORY_URL: http://inventory:8000
      PAYMENTS_URL: http://payments:8000
      WORK_MS: ${ORDERS_WORK_MS:-20}
      ERROR_RATE: ${ORDERS_ERROR_RATE:-0}
      SLOW_RATE: ${ORDERS_SLOW_RATE:-0}
    depends_on:
      inventory:
        condition: service_healthy
      payments:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck: *py-healthcheck

  payments:
    build:
      context: ./services
      args:
        SERVICE: payments
    image: tracing-tax/payments:dev
    <<: *service-limits
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: payments
      WORK_MS: ${PAYMENTS_WORK_MS:-30}
      ERROR_RATE: ${PAYMENTS_ERROR_RATE:-0}
      SLOW_RATE: ${PAYMENTS_SLOW_RATE:-0}
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck: *py-healthcheck

  inventory:
    build:
      context: ./services
      args:
        SERVICE: inventory
    image: tracing-tax/inventory:dev
    <<: *service-limits
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: inventory
      REDIS_URL: redis://redis:6379/0
      ERROR_RATE: ${INVENTORY_ERROR_RATE:-0}
      SLOW_RATE: ${INVENTORY_SLOW_RATE:-0}
    depends_on:
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck: *py-healthcheck

  redis:
    image: redis:8.10.3-alpine3.23
    <<: *service-limits
    # Pure in-memory: no RDB snapshots or AOF, so disk I/O does not add noise.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    <<: *service-limits
    command: ["--config=/etc/otelcol/configs/${COLLECTOR_CONFIG:-passthrough}.yaml"]
    volumes:
      - ./collector/configs:/etc/otelcol/configs:ro
    depends_on:
      - jaeger

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
    command: ["--config=/etc/jaeger/config.yaml"]
    environment:
      # Jaeger traces its own query API by default and stores those spans next
      # to the services' traces, so every script querying Jaeger would add
      # spans to storage. Its internal tracer honours standard OTel SDK env vars.
      OTEL_TRACES_SAMPLER: always_off
    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "16686:16686" # UI + query API

  # --- Load generation ----------------------------------------------------

  # Opt-in (profile "load"): `docker compose up` never starts load by itself.
  # Headless: docker compose run --rm locust --headless -u 50 -r 50 -t 2m --csv /mnt/results/load/high
  # Web UI:   docker compose --profile load up -d locust   -> http://localhost:8089
  locust:
    image: locustio/locust:2.47.0
    profiles: [load]
    # Own limits: the load generator must not compete with the measured
    # services, and must not be throttled itself (that would cap the RPS).
    cpus: 1.0
    mem_limit: 512m
    environment:
      # Locust reads every CLI option from LOCUST_* env vars.
      LOCUST_LOCUSTFILE: /mnt/load/locustfile.py
      LOCUST_HOST: http://gateway:8000
    volumes:
      - ./load:/mnt/load:ro
      - ./results:/mnt/results
    ports:
      - "8089:8089" # web UI
    depends_on:
      gateway:
        condition: service_healthy

  # --- Monitoring ---------------------------------------------------------

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    <<: *monitoring-limits
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --enable_metrics=cpu,memory,network
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /dev/disk:/dev/disk:ro
      # cAdvisor reads the Docker data-root from `docker info`, so it must be
      # mounted at the same path. Set DOCKER_DATA_ROOT in .env if your daemon
      # uses a non-default "data-root".
      - ${DOCKER_DATA_ROOT:-/var/lib/docker}:${DOCKER_DATA_ROOT:-/var/lib/docker}:ro
    # Not published: host port 8080 belongs to the gateway.

  prometheus:
    image: prom/prometheus:v3.16.0
    <<: *monitoring-limits
    cpus: 1.0
    mem_limit: 1g
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Named volume: metrics survive `docker compose down` (not `down -v`).
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:13.3.1
    <<: *monitoring-limits
    mem_limit: 512m
    environment:
      # Local research stand: dashboards are viewable without login
      # (anonymous users are Viewers). Log in as admin/admin to edit or Explore.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tracing-tax.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      # Mount only what we provision, keeping the image's other (empty)
      # provisioning folders so Grafana doesn't log missing-directory errors.
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  prometheus-data:
