# Tail-based sampling (scenario D): services export 100% of spans, the
# collector buffers each trace for `decision_wait` and then keeps it if ANY
# policy matches: an error anywhere in the trace, a trace longer than the slow
# threshold, or a 10% probabilistic baseline of everything else.
# Options per the tail_sampling processor README at the pinned version
# (opentelemetry-collector-contrib v0.165.0).

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  tail_sampling:
    # Must cover the SDK batch delay (5 s: services export their spans of the
    # same trace at different times) plus the longest trace (~0.5 s slow
    # request, 5 s downstream timeout). scripts/run_experiment.py relies on
    # this value (TAIL_DECISION_WAIT_S).
    decision_wait: 10s
    # ~30 traces/s x 10 s are buffered at the high load level; large headroom
    # so no trace is evicted before its decision.
    num_traces: 50000
    expected_new_traces_per_sec: 50
    # Remember decisions after a trace leaves the buffer, so late spans follow
    # the trace's decision instead of starting a new (partial) one.
    decision_cache:
      sampled_cache_size: 100000
      non_sampled_cache_size: 100000
    policies:
      - name: errors
        type: status_code
        status_code: {status_codes: [ERROR]}
      - name: slow
        type: latency
        # Same as SLOW_DELAY_MS and run_experiment.py --slow-threshold-ms.
        latency: {threshold_ms: 500}
      - name: baseline
        type: probabilistic
        probabilistic: {sampling_percentage: 10}
  batch: {}

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      # Sample first, then batch only what is kept.
      processors: [tail_sampling, batch]
      exporters: [otlp_grpc/jaeger]
  telemetry:
    # Collector self-metrics in Prometheus format (same as passthrough.yaml),
    # plus otelcol_processor_tail_sampling_* (decisions per policy, late spans).
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
