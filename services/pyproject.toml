[project]
name = "tracing-tax-services"
version = "0.1.0"
description = "Python microservices (gateway, orders, ...) of the tracing-tax research stand"
requires-python = "==3.14.*"
# Direct dependencies, pinned exactly. The full tree is locked in uv.lock.
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    # OpenTelemetry zero-code instrumentation. Instrumentation packages are
    # pinned explicitly instead of using `opentelemetry-bootstrap -a install`,
    # which resolves versions at build time.
    "opentelemetry-distro==0.66b2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-httpx==0.66b2",
]

[tool.uv]
# Not an installable package: just a locked environment for the services.
package = false
