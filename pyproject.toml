[project]
name = "tracing-tax"
version = "0.1.0"
description = "Research stand comparing trace sampling strategies and their impact on microservice load"
readme = "README.md"
authors = [
    { name = "Maksym Farenyk", email = "maxfar2004@gmail.com" }
]
requires-python = ">=3.14"
# Host-side tooling goes here (the stdlib scripts in scripts/ need none;
# analysis/ needs pandas and matplotlib).
# The containerised services have their own lock: services/requirements.txt.
dependencies = [
    "matplotlib==3.11.2",
    "pandas==3.1.1",
]

[tool.uv]
package = false
